[package]
name = "ossuary"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ossuary-freebsd"
path = "src/bin/ossuary-freebsd.rs"

[[bin]]
name = "ossuary-openbsd"
path = "src/bin/ossuary-openbsd.rs"

[[bin]]
name = "ossuary-linux"
path = "src/bin/ossuary-linux.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
libc = "0.2"